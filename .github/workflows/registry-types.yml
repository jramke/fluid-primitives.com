name: Registry types

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  registry-types:
    name: Registry entries / tsc
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Build the client library
        run: |
          npm ci --prefix packages/fluid-primitives
          npm run primitives:build

      - name: Install dependencies
        run: npm ci

      - name: Type check registry entries
        run: npm run types:registry
