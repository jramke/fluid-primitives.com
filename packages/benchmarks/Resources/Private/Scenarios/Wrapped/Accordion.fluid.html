<f:for each="{indices}" as="i">
    <bench:accordion.root>
        <bench:accordion.item value="item-{i}-1">
            <bench:accordion.itemTrigger>Item 1</bench:accordion.itemTrigger>
            <bench:accordion.itemContent>Content for item 1</bench:accordion.itemContent>
        </bench:accordion.item>
        <bench:accordion.item value="item-{i}-2">
            <bench:accordion.itemTrigger>Item 2</bench:accordion.itemTrigger>
            <bench:accordion.itemContent>Content for item 2</bench:accordion.itemContent>
        </bench:accordion.item>
        <bench:accordion.item value="item-{i}-3">
            <bench:accordion.itemTrigger>Item 3</bench:accordion.itemTrigger>
            <bench:accordion.itemContent>Content for item 3</bench:accordion.itemContent>
        </bench:accordion.item>
    </bench:accordion.root>
</f:for>
