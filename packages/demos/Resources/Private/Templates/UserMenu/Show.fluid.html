<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:if condition="{user}">
    <f:then>
        <ui:menu.root positioning="{placement: 'bottom-end', gutter: 8}">
            <ui:menu.trigger class="size-9 rounded-full px-0 py-0 font-semibold" aria-label="Account menu of {user.name}">
                <f:comment>An Avatar would go here</f:comment>
                <span aria-hidden="true">{user.initials}</span>
            </ui:menu.trigger>
            <ui:menu.content class="w-60">
                <ui:menu.itemGroup value="account">
                    <ui:menu.itemGroupLabel>
                        <span class="block truncate text-sm font-medium text-foreground">{user.name}</span>
                        <span class="block truncate text-xs font-normal text-muted-foreground">{user.email}</span>
                    </ui:menu.itemGroupLabel>
                    <ui:menu.item asChild="{true}" value="settings">
                        <a href="/acme/account">Account settings</a>
                    </ui:menu.item>
                </ui:menu.itemGroup>
                <ui:menu.separator />
                <f:comment>The frontend login of TYPO3 logs out on any page with this parameter</f:comment>
                <ui:menu.item asChild="{true}" value="logout">
                    <a href="{f:uri.page(additionalParams: {logintype: 'logout'})}">Log out</a>
                </ui:menu.item>
            </ui:menu.content>
        </ui:menu.root>
    </f:then>
    <f:else>
        <ui:button asChild="{true}" variant="secondary">
            <a href="/acme/login">Log in</a>
        </ui:button>
    </f:else>
</f:if>
</html>
