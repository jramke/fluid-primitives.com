<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:if condition="{user}">
    <f:then>
        <ui:menu.root positioning="{placement: 'bottom-end', gutter: 8}">
            <ui:menu.trigger class="size-9 rounded-full px-0 py-0 font-semibold" aria-label="Account menu of {user.name}">
                <f:comment>An Avatar would go here</f:comment>
                <span aria-hidden="true">{user.initials}</span>
            </ui:menu.trigger>
            <ui:menu.content class="w-60">
                <ui:menu.itemGroup value="account">
                    <ui:menu.itemGroupLabel>
                        <span class="block truncate text-sm font-medium text-foreground">{user.name}</span>
                        <span class="block truncate text-xs font-normal text-muted-foreground">{user.email}</span>
                    </ui:menu.itemGroupLabel>
                    <ui:menu.item asChild="{true}" value="settings">
                        <a href="/acme/account">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            Account settings
                        </a>
                    </ui:menu.item>
                </ui:menu.itemGroup>
                <ui:menu.separator />
                <f:comment>The frontend login of TYPO3 logs out on any page with this parameter</f:comment>
                <ui:menu.item asChild="{true}" value="logout">
                    <a href="{f:uri.page(additionalParams: {logintype: 'logout'})}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m16 17 5-5-5-5"></path>
                            <path d="M21 12H9"></path>
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        </svg>
                        Log out
                    </a>
                </ui:menu.item>
            </ui:menu.content>
        </ui:menu.root>
    </f:then>
    <f:else>
        <ui:button asChild="{true}" variant="secondary">
            <a href="/acme/login">Log in</a>
        </ui:button>
    </f:else>
</f:if>
</html>
