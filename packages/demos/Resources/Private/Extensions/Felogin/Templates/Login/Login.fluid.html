<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:comment>
    A native form: felogin logs in on a full request. The inputs keep the names felogin reads, user, pass and
    logintype.
</f:comment>
<section class="mx-auto max-w-md rounded-xl border p-6 sm:p-8">
    <h1 class="text-xl font-semibold">Log in</h1>
    <p class="mt-1 text-sm text-muted-foreground">
        No account yet? <a href="/acme/register" class="underline underline-offset-4">Create one</a>
    </p>

    <f:if condition="{messageKey} == 'error'">
        <ui:alert class="mt-6" variant="destructive" title="{f:render(partial: 'RenderLabelOrMessage', arguments: {key: 'error_header'})}" text="{f:render(partial: 'RenderLabelOrMessage', arguments: {key: 'error_message'})}" />
    </f:if>

    <f:form fieldNamePrefix="" action="login" requestToken="{requestToken}" spellcheck="false" class="mt-6 space-y-5" id="login-form">
        <ui:field.root name="user" required="{true}">
            <ui:input.root type="email" autocomplete="username">
                <ui:input.label>Email</ui:input.label>
                <ui:input.input data-1p-ignore="" data-lpignore="true" data-bwignore="true" data-form-type="other" data-protonpass-ignore="true" />
            </ui:input.root>
            <ui:field.errorText />
        </ui:field.root>

        <ui:field.root name="pass" required="{true}">
            <ui:passwordInput.root ignorePasswordManagers="{true}" autoComplete="{f:constant(name: 'Jramke\FluidPrimitives\Enum\PasswordAutoComplete::CurrentPassword')}">
                <ui:passwordInput.label>Password</ui:passwordInput.label>
                <ui:passwordInput.control>
                    <ui:passwordInput.input />
                    <ui:passwordInput.visibilityTrigger />
                </ui:passwordInput.control>
            </ui:passwordInput.root>
            <ui:field.errorText />
        </ui:field.root>

        <f:form.hidden name="logintype" value="login" />
        <f:if condition="{redirectURL}">
            <f:form.hidden name="redirect_url" value="{redirectURL}" />
        </f:if>
        <f:if condition="{referer}">
            <f:form.hidden name="referer" value="{referer}" />
        </f:if>
        <f:if condition="{noRedirect}">
            <f:form.hidden name="noredirect" value="1" />
        </f:if>

        <ui:button type="submit" class="w-full">Log in</ui:button>
    </f:form>
</section>
</html>
