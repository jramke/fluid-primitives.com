<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<section class="mx-auto max-w-md rounded-xl border p-6 sm:p-8">
    <h1 class="text-xl font-semibold">You are logged in</h1>
    <p class="mt-1 text-sm text-muted-foreground">As {user.username}</p>
    <f:form action="login" fieldNamePrefix="" class="mt-6">
        <f:form.hidden name="logintype" value="logout" />
        <ui:button type="submit" variant="secondary">Log out</ui:button>
    </f:form>
</section>
</html>
