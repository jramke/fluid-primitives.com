<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<section class="max-w-md rounded-xl border p-6 sm:p-8">
    <h2 class="text-xl font-semibold">Hello {user.name}</h2>
    <p class="mt-1 text-sm text-muted-foreground">
        You are logged in as {user.username}. The demo deletes your account a day after you created it.
    </p>
    <f:form action="login" target="_top" fieldNamePrefix="" class="mt-6">
        <f:form.hidden name="logintype" value="logout" />
        <f:if condition="{noRedirect}">
            <f:form.hidden name="noredirect" value="1" />
        </f:if>
        <ui:button type="submit" variant="secondary">Log out</ui:button>
    </f:form>
</section>
</html>
