<ui:skipNavLink />
<ui:navigation nav="{nav}" path="{path}" mainLinks="{mainLinks}" versions="{versions}" />


<main class="content-grid py-30 md:ms-[250px] lg:pe-[250px] me-auto lg:w-[calc(100%-250px)] prose" id="main">
    <f:format.raw>{content}</f:format.raw>
    <f:if condition="{sections}">
        <ui:accordion.root multiple="{true}" defaultValue="{openSections}" rootId="page-sections" class="mt-10 border-t">
            <f:for each="{sections}" as="section">
                <primitives:accordion.item value="{section.id}" class="mt-0 border-b">
                    <primitives:accordion.itemHeader level="2" id="{section.id}" class="m-0 scroll-mt-24 lg:scroll-mt-20">
                        <primitives:accordion.itemTrigger class="focus-visible:ring-ring/50 group flex w-full cursor-pointer items-center gap-2 rounded-md py-4 text-left outline-none focus-visible:ring-[3px]">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4 shrink-0 text-muted-foreground transition-transform duration-200 group-data-[state=open]:rotate-90" aria-hidden="true">
                                <path d="m9 18 6-6-6-6"></path>
                            </svg>
                            <f:format.raw>{section.title}</f:format.raw>
                            <f:if condition="{section.date}">
                                <time datetime="{section.date}" class="ms-auto mt-0 text-sm font-normal text-muted-foreground">{section.date}</time>
                            </f:if>
                        </primitives:accordion.itemTrigger>
                    </primitives:accordion.itemHeader>
                    <primitives:accordion.itemContent class="mt-0 grid transition-all duration-200 ease-out transition-discrete data-[state=closed]:grid-rows-[0fr] data-[state=open]:grid-rows-[1fr] starting:data-[state=open]:grid-rows-[0fr]">
                        <div class="overflow-hidden">
                            <div class="pb-8">
                                <f:format.raw>{section.body}</f:format.raw>
                            </div>
                        </div>
                    </primitives:accordion.itemContent>
                </primitives:accordion.item>
            </f:for>
        </ui:accordion.root>
        <vite:asset entry="EXT:docs/Resources/Private/js/OpenAnchoredSection.entry.ts" />
    </f:if>
</main>

<f:if condition="{toc}">
    <ui:toc.root items="{toc}" class="fixed right-[var(--scrollbar-width,0px)] top-0 hidden h-screen w-[250px] flex-col pb-8 pe-8 pt-31 lg:flex">
        <ui:toc.title class="-ms-1 flex items-center gap-1.5">
            <ui:icon.toc />
            On this page
        </ui:toc.title>
        <ui:scrollArea.root class="min-h-0 flex-1">
            <ui:scrollArea.viewport>
                <ui:scrollArea.content>
                    <ui:toc.list>
                        <li><a href="#" class="block py-1 text-muted-foreground transition-colors hover:text-foreground focus-visible:text-foreground">(Top)</a></li>
                        <f:for each="{toc}" as="heading">
                            <ui:toc.item value="{heading.value}">
                                <ui:toc.link>{heading.label}</ui:toc.link>
                            </ui:toc.item>
                        </f:for>
                    </ui:toc.list>
                </ui:scrollArea.content>
            </ui:scrollArea.viewport>
            <ui:scrollArea.scrollbar>
                <ui:scrollArea.thumb />
            </ui:scrollArea.scrollbar>
        </ui:scrollArea.root>
    </ui:toc.root>
</f:if>
