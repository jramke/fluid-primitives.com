<ui:skipNavLink />
<ui:navigation nav="{nav}" path="{path}" mainLinks="{mainLinks}" versions="{versions}" />


<main class="content-grid py-30 md:ms-[250px] lg:pe-[250px] me-auto lg:w-[calc(100%-250px)] prose" id="main">
    <f:format.raw>{content}</f:format.raw>
</main>

<f:if condition="{toc}">
    <ui:toc.root items="{toc}" class="fixed right-[var(--scrollbar-width,0px)] top-0 hidden h-screen w-[250px] flex-col pb-8 pe-8 pt-31 lg:flex">
        <ui:toc.title class="-ms-1 flex items-center gap-1.5">
            <ui:icon.toc />
            On this page
        </ui:toc.title>
        <ui:scrollArea.root class="min-h-0 flex-1">
            <ui:scrollArea.viewport>
                <ui:scrollArea.content>
                    <ui:toc.list>
                        <li><a href="#" class="block py-1 text-muted-foreground transition-colors hover:text-foreground focus-visible:text-foreground">(Top)</a></li>
                        <f:for each="{toc}" as="heading">
                            <ui:toc.item value="{heading.value}">
                                <ui:toc.link>{heading.label}</ui:toc.link>
                            </ui:toc.item>
                        </f:for>
                    </ui:toc.list>
                </ui:scrollArea.content>
            </ui:scrollArea.viewport>
            <ui:scrollArea.scrollbar>
                <ui:scrollArea.thumb />
            </ui:scrollArea.scrollbar>
        </ui:scrollArea.root>
    </ui:toc.root>
</f:if>
