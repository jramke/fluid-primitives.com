<f:variable name="headings" value="{
    0: {value: 'toc-nested-delivery', depth: 2, label: 'Delivery', text: 'Orders placed before 2 pm on a working day ship the same day. You get a tracking link by email once the parcel leaves the warehouse.'},
    1: {value: 'toc-nested-delivery-times', depth: 3, label: 'Delivery times', text: 'Parcels reach most addresses in Germany within two working days, the rest of Europe takes up to five.'},
    2: {value: 'toc-nested-shipping-costs', depth: 3, label: 'Shipping costs', text: 'Shipping is free from 50 EUR. Below that it costs 4.90 EUR within Germany.'},
    3: {value: 'toc-nested-returns', depth: 2, label: 'Returns', text: 'You can return unworn items within 30 days. Print the return label from your order confirmation and drop the parcel at any post office.'},
    4: {value: 'toc-nested-refunds', depth: 3, label: 'Refunds', text: 'We refund the price of the items to the payment method you used.'},
    5: {value: 'toc-nested-refund-times', depth: 4, label: 'Refund times', text: 'A refund arrives within five working days after we receive the parcel.'},
    6: {value: 'toc-nested-contact', depth: 2, label: 'Contact', text: 'Write to support@example.com or call us on weekdays between 9 am and 5 pm.'}
}" />

<div class="flex h-80 w-full max-w-xl gap-8">
    <div id="toc-nested-content" class="min-w-0 flex-1 overflow-y-auto rounded-md border px-4">
        <f:for each="{headings}" as="heading">
            <section class="min-h-48 py-3">
                <h{heading.depth} id="{heading.value}" class="font-semibold text-foreground">{heading.label}</h{heading.depth}>
                <p class="mt-2 text-sm text-muted-foreground">{heading.text}</p>
            </section>
        </f:for>
    </div>
    <ui:toc.root items="{headings}" scrollEl="#toc-nested-content" autoScroll="{false}" class="w-44 shrink-0">
        <ui:toc.title>On this page</ui:toc.title>
        <ui:toc.list>
            <f:for each="{headings}" as="heading">
                <ui:toc.item value="{heading.value}"><ui:toc.link>{heading.label}</ui:toc.link></ui:toc.item>
            </f:for>
        </ui:toc.list>
    </ui:toc.root>
</div>
