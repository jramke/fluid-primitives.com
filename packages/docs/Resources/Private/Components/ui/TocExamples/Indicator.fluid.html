<f:variable name="headings" value="{
    0: {value: 'toc-indicator-delivery', depth: 2, label: 'Delivery', text: 'Orders placed before 2 pm on a working day ship the same day. You get a tracking link by email once the parcel leaves the warehouse, and you can follow it until the courier hands it over at your door.'},
    1: {value: 'toc-indicator-returns', depth: 2, label: 'Returns', text: 'You can return unworn items within 30 days. Print the return label from your order confirmation and drop the parcel at any post office. Keep the receipt of the post office until your refund has arrived.'},
    2: {value: 'toc-indicator-refunds', depth: 3, label: 'Refunds', text: 'We refund the price of the items to the payment method you used. The shipping costs come back too if you return the whole order, otherwise they stay with the items you keep.'},
    3: {value: 'toc-indicator-payment', depth: 2, label: 'Payment', text: 'We accept credit card, PayPal and invoice. Your card is charged when the order ships, not when you place it, so an item that is out of stock never costs you anything.'},
    4: {value: 'toc-indicator-contact', depth: 2, label: 'Contact', text: 'Write to support@example.com or call us on weekdays between 9 am and 5 pm. We answer emails within one working day, and a call is quicker for questions about a parcel on its way.'}
}" />

<div class="flex h-56 w-full max-w-xl gap-8">
    <div id="toc-indicator-content" class="min-w-0 flex-1 overflow-y-auto rounded-md border px-4">
        <f:for each="{headings}" as="heading">
            <section class="min-h-28 py-3">
                <h{heading.depth} id="{heading.value}" class="font-semibold text-foreground">{heading.label}</h{heading.depth}>
                <p class="mt-2 text-sm text-muted-foreground">{heading.text}</p>
            </section>
        </f:for>
    </div>
    <ui:toc.root items="{headings}" scrollEl="#toc-indicator-content" autoScroll="{false}" class="w-44 shrink-0">
        <ui:toc.title>On this page</ui:toc.title>
        <ui:toc.list class="border-s">
            <ui:toc.indicator class="-start-px" />
            <f:for each="{headings}" as="heading">
                <ui:toc.item value="{heading.value}"><ui:toc.link class="ps-3">{heading.label}</ui:toc.link></ui:toc.item>
            </f:for>
        </ui:toc.list>
    </ui:toc.root>
</div>
