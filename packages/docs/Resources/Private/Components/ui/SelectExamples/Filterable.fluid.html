<ui:listCollection
    items="{
        0: {value: 'apple', label: 'Apple'},
        1: {value: 'apricot', label: 'Apricot'},
        2: {value: 'banana', label: 'Banana'},
        3: {value: 'blueberry', label: 'Blueberry'},
        4: {value: 'cherry', label: 'Cherry'},
        5: {value: 'grape', label: 'Grape'},
        6: {value: 'lemon', label: 'Lemon'},
        7: {value: 'peach', label: 'Peach'}
    }"
    as="collection" />

<ui:select.root collection="{collection}" popupType="{f:constant(name: 'Jramke\FluidPrimitives\Enum\PopupType::Dialog')}">
    <ui:select.label>Select a fruit</ui:select.label>
    <ui:select.control class="min-w-48">
        <ui:select.trigger placeholder="Choose a fruit" />
    </ui:select.control>
    <ui:select.content>
        <ui:select.input placeholder="Search fruits" />
        <ui:select.list>
            <f:for each="{collection.items}" as="item">
                <ui:select.item item="{item}">
                    <ui:select.itemText>{item.label}</ui:select.itemText>
                    <ui:select.itemIndicator />
                </ui:select.item>
            </f:for>
        </ui:select.list>
        <ui:select.empty>No fruits found</ui:select.empty>
    </ui:select.content>
</ui:select.root>
