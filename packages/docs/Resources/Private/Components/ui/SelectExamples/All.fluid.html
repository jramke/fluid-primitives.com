<ui:prop name="example_id" type="string" default="default" />

<f:switch expression="{example_id}">
    <f:case value="simple">
        <ui:selectExamples.simple />
    </f:case>
    <f:case value="default-value">
        <ui:selectExamples.defaultValue />
    </f:case>
    <f:case value="with-groups">
        <ui:selectExamples.withGroups />
    </f:case>
    <f:case value="with-field">
        <ui:selectExamples.withField />
    </f:case>
    <f:case value="multiple">
        <ui:selectExamples.multiple />
    </f:case>
    <f:case value="disabled-items">
        <ui:selectExamples.disabledItems />
    </f:case>
    <f:case value="with-tabs">
        <ui:selectExamples.withTabs />
    </f:case>
</f:switch>

<ui:portalContainer />
