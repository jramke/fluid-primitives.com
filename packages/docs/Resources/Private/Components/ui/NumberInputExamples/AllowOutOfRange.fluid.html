<ui:form.root actionUri="#" class="w-full max-w-74">
    <ui:form.content class="space-y-6">
        <ui:field.root name="guests" required="{true}">
            <ui:numberInput.root min="1" max="8" defaultValue="2" allowOutOfRange="{true}">
                <ui:numberInput.label>Guests</ui:numberInput.label>
                <ui:numberInput.control>
                    <ui:numberInput.decrementTrigger />
                    <ui:numberInput.input />
                    <ui:numberInput.incrementTrigger />
                </ui:numberInput.control>
            </ui:numberInput.root>
            <ui:field.helperText>A table seats up to eight guests.</ui:field.helperText>
            <ui:field.errorText match="{f:constant(name: 'Jramke\FluidPrimitives\Enum\ValidityMatch::ValueMissing')}">Please enter the number of guests.</ui:field.errorText>
            <ui:field.errorText match="{f:constant(name: 'Jramke\FluidPrimitives\Enum\ValidityMatch::RangeUnderflow')}">Book for at least one guest.</ui:field.errorText>
            <ui:field.errorText match="{f:constant(name: 'Jramke\FluidPrimitives\Enum\ValidityMatch::RangeOverflow')}">For more than eight guests, please call us.</ui:field.errorText>
        </ui:field.root>

        <ui:button type="submit">Book a table</ui:button>
    </ui:form.content>
</ui:form.root>
