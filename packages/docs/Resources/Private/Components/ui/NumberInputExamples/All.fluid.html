<ui:prop name="example_id" type="string" default="default" />

<f:switch expression="{example_id}">
    <f:case value="simple">
        <ui:numberInputExamples.simple />
    </f:case>
    <f:case value="min-max">
        <ui:numberInputExamples.minMax />
    </f:case>
    <f:case value="format-options">
        <ui:numberInputExamples.formatOptions />
    </f:case>
    <f:case value="mouse-wheel">
        <ui:numberInputExamples.mouseWheel />
    </f:case>
    <f:case value="with-scrubber">
        <ui:numberInputExamples.withScrubber />
    </f:case>
</f:switch>
