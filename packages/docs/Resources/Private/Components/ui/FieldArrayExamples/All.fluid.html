<ui:prop name="example_id" type="string" default="simple" />

<f:switch expression="{example_id}">
    <f:case value="simple">
        <ui:fieldArrayExamples.simple />
    </f:case>
    <f:case value="empty">
        <ui:fieldArrayExamples.empty />
    </f:case>
    <f:case value="limited">
        <ui:fieldArrayExamples.limited />
    </f:case>
</f:switch>
