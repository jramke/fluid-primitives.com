<ui:field.root name="username" required="{true}">
    <ui:input.root type="text" autocomplete="username">
        <ui:input.label>Username</ui:input.label>
        <ui:input.input />
    </ui:input.root>
    <ui:field.description>Choose a unique username for your account.</ui:field.description>
    <ui:field.error />
</ui:field.root>
