<ui:dialog.root modal="{false}" preventScroll="{false}" trapFocus="{false}" closeOnInteractOutside="{false}">
    <ui:dialog.trigger asChild="{true}">
        <ui:button>Open Dialog</ui:button>
    </ui:dialog.trigger>
    <ui:dialog.content class="max-w-xs">
        <ui:dialog.header>
            <ui:dialog.title>Tips</ui:dialog.title>
            <ui:dialog.description>The page behind this dialog stays usable. There is no backdrop.</ui:dialog.description>
        </ui:dialog.header>
    </ui:dialog.content>
</ui:dialog.root>
