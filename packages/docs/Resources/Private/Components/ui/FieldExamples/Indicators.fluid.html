<ui:field.root class="max-w-74" name="handle" required="{true}">
    <ui:input.root type="text">
        <ui:input.label>Handle</ui:input.label>
        <ui:input.input pattern="[a-z0-9_]+" minlength="3" />
    </ui:input.root>
    <div class="flex items-center gap-3">
        <ui:field.indicator type="{f:constant(name: 'Jramke\FluidPrimitives\Enum\FieldIndicatorType::Required')}">Required</ui:field.indicator>
        <ui:field.indicator type="{f:constant(name: 'Jramke\FluidPrimitives\Enum\FieldIndicatorType::Valid')}">Looks good</ui:field.indicator>
        <ui:field.indicator type="{f:constant(name: 'Jramke\FluidPrimitives\Enum\FieldIndicatorType::Invalid')}">Not valid</ui:field.indicator>
    </div>
    <ui:field.helperText>At least three lowercase letters, digits or underscores.</ui:field.helperText>
    <ui:field.errorText />
</ui:field.root>
