<ui:menu.provider id="note-actions" />

<div class="flex items-center justify-between gap-4">
    <span>Meeting notes</span>
    <ui:menu.trigger provider="note-actions">Actions</ui:menu.trigger>
</div>

<ui:menu.root provider="note-actions">
    <ui:menu.content>
        <ui:menu.item value="rename">Rename</ui:menu.item>
        <ui:menu.triggerItem childId="note-share">Share</ui:menu.triggerItem>
        <ui:menu.separator />
        <ui:menu.item value="delete">Delete</ui:menu.item>
    </ui:menu.content>
</ui:menu.root>

<f:comment>The id of the provider is the rootId of the menu, so parentId names it.</f:comment>
<ui:menu.root rootId="note-share" parentId="note-actions" positioning="{ placement: 'right-start' }">
    <ui:menu.content>
        <ui:menu.item value="email">Email</ui:menu.item>
        <ui:menu.item value="copy-link">Copy link</ui:menu.item>
    </ui:menu.content>
</ui:menu.root>
