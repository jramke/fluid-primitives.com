<ui:prop name="example_id" type="string" default="default" />

<f:switch expression="{example_id}">
    <f:case value="simple">
        <ui:navigationMenuExamples.simple />
    </f:case>
    <f:case value="with-links">
        <ui:navigationMenuExamples.withLinks />
    </f:case>
    <f:case value="with-viewport">
        <ui:navigationMenuExamples.withViewport />
    </f:case>
</f:switch>
