<ui:prop name="example_id" type="string" default="default" />

<f:switch expression="{example_id}">
    <f:case value="simple">
        <ui:radioGroupExamples.simple />
    </f:case>
    <f:case value="disabled-group">
        <ui:radioGroupExamples.disabledGroup />
    </f:case>
    <f:case value="disabled-items">
        <ui:radioGroupExamples.disabledItems />
    </f:case>
    <f:case value="no-default">
        <ui:radioGroupExamples.noDefault />
    </f:case>
</f:switch>
