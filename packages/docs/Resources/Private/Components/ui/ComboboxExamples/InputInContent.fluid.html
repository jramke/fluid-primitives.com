<ui:listCollection
    items="{
        0: {value: 'amsterdam', label: 'Amsterdam'},
        1: {value: 'athens', label: 'Athens'},
        2: {value: 'barcelona', label: 'Barcelona'},
        3: {value: 'berlin', label: 'Berlin'},
        4: {value: 'copenhagen', label: 'Copenhagen'},
        5: {value: 'dublin', label: 'Dublin'},
        6: {value: 'helsinki', label: 'Helsinki'},
        7: {value: 'lisbon', label: 'Lisbon'},
        8: {value: 'madrid', label: 'Madrid'},
        9: {value: 'oslo', label: 'Oslo'},
        10: {value: 'paris', label: 'Paris'},
        11: {value: 'prague', label: 'Prague'},
        12: {value: 'rome', label: 'Rome'},
        13: {value: 'stockholm', label: 'Stockholm'},
        14: {value: 'vienna', label: 'Vienna'},
        15: {value: 'warsaw', label: 'Warsaw'}
    }"
    as="collection" />

<ui:combobox.root
    collection="{collection}"
    placeholder="Search for cities"
    popupType="{f:constant(name: 'Jramke\FluidPrimitives\Enum\PopupType::Dialog')}"
    controlled="{true}"
    rootId="input-in-content">
    <ui:combobox.label>Select a city</ui:combobox.label>
    <ui:combobox.trigger class="!text-foreground !justify-between border-input h-9 w-full min-w-64 gap-2 rounded-md border px-3 text-sm shadow-xs">
        <span {ui:ref(name: 'valueText' , context: 'combobox' )} class="text-muted-foreground truncate">Choose a city</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4 opacity-50">
            <path d="m7 15 5 5 5-5"></path>
            <path d="m7 9 5-5 5 5"></path>
        </svg>
    </ui:combobox.trigger>
    <ui:combobox.content>
        <ui:combobox.input class="flex-none border-b" />
        <ui:combobox.empty>No cities found.</ui:combobox.empty>
        <ui:combobox.list>
            <f:for each="{collection.items}" as="item">
                <ui:combobox.item item="{item}">
                    <ui:combobox.itemText>{item.label}</ui:combobox.itemText>
                    <ui:combobox.itemIndicator />
                </ui:combobox.item>
            </f:for>
        </ui:combobox.list>
    </ui:combobox.content>
</ui:combobox.root>
