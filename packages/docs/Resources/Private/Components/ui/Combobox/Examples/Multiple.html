<ui:listCollection
    items="{
        0: {value: 'react', label: 'React'},
        1: {value: 'vue', label: 'Vue'},
        2: {value: 'angular', label: 'Angular'},
        3: {value: 'svelte', label: 'Svelte'},
        4: {value: 'solid', label: 'Solid'},
        5: {value: 'qwik', label: 'Qwik'},
        6: {value: 'alpine', label: 'Alpine.js'},
        7: {value: 'preact', label: 'Preact'},
        8: {value: 'lit', label: 'Lit'},
        9: {value: 'astro', label: 'Astro'},
        10: {value: 'ember', label: 'Ember'},
        11: {value: 'backbone', label: 'Backbone'}
    }"
    as="collection" />

<ui:combobox.root collection="{collection}" multiple="{true}" selectionBehavior="clear">
    <ui:combobox.label>Select frameworks</ui:combobox.label>
    <ui:combobox.control class="min-w-64">
        <ui:combobox.input placeholder="Search frontend frameworks" />
        <ui:combobox.clearTrigger />
        <ui:combobox.trigger>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4 opacity-70">
                <path d="m7 15 5 5 5-5"></path>
                <path d="m7 9 5-5 5 5"></path>
            </svg>
        </ui:combobox.trigger>
    </ui:combobox.control>
    <div class="text-muted-foreground text-xs">Multiple selection clears the input after each pick.</div>
    <ui:combobox.content>
        <f:for each="{collection.items}" as="item">
            <ui:combobox.item item="{item}">
                <ui:combobox.itemText>{item.label}</ui:combobox.itemText>
                <ui:combobox.itemIndicator />
            </ui:combobox.item>
        </f:for>
    </ui:combobox.content>
</ui:combobox.root>
