<ui:combobox.root
    rootId="async-search-grouped"
    controlled="{true}"
    searchUrl="{f:uri.action(action: 'search', controller: 'CitySearch')}">
    <ui:combobox.label>Search for a city</ui:combobox.label>
    <ui:combobox.control class="min-w-64">
        <ui:combobox.input placeholder="Type to search…" />
        <ui:combobox.clearTrigger />
    </ui:combobox.control>
    <div class="text-muted-foreground text-sm">Items are fetched from a search endpoint.</div>
    <ui:combobox.content>
        <ui:combobox.empty class="flex items-center justify-center gap-2">
            <svg {ui:ref(name: 'statusSpinner' , context: 'combobox' )} hidden xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4 animate-spin">
                <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
            </svg>
            <span {ui:ref(name: 'statusText' , context: 'combobox' )}>Start typing to search…</span>
        </ui:combobox.empty>
        <ui:template name="groupTemplate" context="combobox">
            <ui:combobox.itemGroup>
                <ui:combobox.itemGroupLabel class="text-muted-foreground px-2 py-1 text-xs font-medium">
                    <span {ui:ref(name: 'group-label' )}></span>
                </ui:combobox.itemGroupLabel>
            </ui:combobox.itemGroup>
        </ui:template>
        <ui:template name="itemTemplate" context="combobox">
            <ui:combobox.item>
                <ui:combobox.itemText>
                    <span {ui:ref(name: 'title' )}></span>
                </ui:combobox.itemText>
                <ui:combobox.itemIndicator />
            </ui:combobox.item>
        </ui:template>
    </ui:combobox.content>
</ui:combobox.root>

<vite:asset entry="EXT:docs/Resources/Private/Components/ui/Combobox/Examples/AsyncSearchGrouped.entry.ts" />
