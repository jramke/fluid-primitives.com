<ui:prop name="example_id" type="string" default="default" />

<f:switch expression="{example_id}">
    <f:case value="simple">
        <ui:toastExamples.simple />
    </f:case>
    <f:case value="types">
        <ui:toastExamples.types />
    </f:case>
    <f:case value="action">
        <ui:toastExamples.action />
    </f:case>
    <f:case value="promise">
        <ui:toastExamples.promise />
    </f:case>
    <f:case value="deduplicate">
        <ui:toastExamples.deduplicate />
    </f:case>
    <f:case value="stack">
        <ui:toastExamples.stack />
    </f:case>
    <f:case value="cart">
        <ui:toastExamples.cart />
    </f:case>
</f:switch>

<f:if condition="{example_id} != 'simple'">
    <ui:toaster rootId="toaster">
        <ui:toaster.toastTemplate>
            <ui:toast.root>
                <ui:toast.indicator type="{f:constant(name: 'Jramke\FluidPrimitives\Enum\ToastType::Success')}" class="mt-0.5 shrink-0 text-success">
                    <svg class="size-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <path d="m9 12 2 2 4-4" />
                    </svg>
                </ui:toast.indicator>
                <ui:toast.indicator type="{f:constant(name: 'Jramke\FluidPrimitives\Enum\ToastType::Warning')}" class="mt-0.5 shrink-0 text-warning">
                    <svg class="size-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
                        <path d="M12 9v4" />
                        <path d="M12 17h.01" />
                    </svg>
                </ui:toast.indicator>
                <ui:toast.indicator type="{f:constant(name: 'Jramke\FluidPrimitives\Enum\ToastType::Error')}" class="mt-0.5 shrink-0 text-destructive">
                    <svg class="size-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <path d="m15 9-6 6" />
                        <path d="m9 9 6 6" />
                    </svg>
                </ui:toast.indicator>
                <ui:toast.indicator type="{f:constant(name: 'Jramke\FluidPrimitives\Enum\ToastType::Loading')}" class="mt-0.5 shrink-0 text-muted-foreground">
                    <svg class="animate-spin size-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
                    </svg>
                </ui:toast.indicator>
                <div class="grid flex-1 gap-1">
                    <ui:toast.title />
                    <ui:toast.description />
                </div>
                <ui:toast.actionTrigger />
                <ui:toast.closeTrigger />
            </ui:toast.root>
        </ui:toaster.toastTemplate>
    </ui:toaster>
</f:if>

<ui:portalContainer />
