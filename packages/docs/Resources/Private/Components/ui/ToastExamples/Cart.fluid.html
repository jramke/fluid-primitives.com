<ui:toaster rootId="cart-toaster" placement="{f:constant(name: 'Jramke\FluidPrimitives\Enum\ToastPlacement::Top')}">
    <ui:toaster.toastTemplate>
        <ui:toast.root class="items-center">
            <img class="size-12 shrink-0 rounded-md" width="48" height="48" alt="" {ui:ref(name: 'image', context: 'toast' )} />
            <div class="grid flex-1 gap-1">
                <ui:toast.title />
                <ui:toast.description />
            </div>
            <ui:toast.closeTrigger />
        </ui:toast.root>
    </ui:toaster.toastTemplate>
</ui:toaster>

<div class="flex flex-wrap gap-2" {ui:ref(name: 'actions' )}>
    <ui:button variant="secondary" data-name="Linen shirt" data-image="{f:uri.resource(path: 'EXT:docs/Resources/Public/Images/Products/linen-shirt.svg')}">Add linen shirt</ui:button>
    <ui:button variant="secondary" data-name="Canvas tote" data-image="{f:uri.resource(path: 'EXT:docs/Resources/Public/Images/Products/canvas-tote.svg')}">Add canvas tote</ui:button>
    <ui:button variant="secondary" data-name="Sunglasses" data-image="{f:uri.resource(path: 'EXT:docs/Resources/Public/Images/Products/sunglasses.svg')}">Add sunglasses</ui:button>
</div>

<vite:asset entry="EXT:docs/Resources/Private/Components/ui/ToastExamples/Cart.entry.ts" />
