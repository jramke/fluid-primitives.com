<ui:field.root name="birthDate" required="{true}">
    <ui:datePicker.root>
        <ui:datePicker.label>Date of birth</ui:datePicker.label>
        <ui:datePicker.control>
            <ui:datePicker.input />
            <ui:datePicker.trigger />
        </ui:datePicker.control>
        <ui:datePicker.content />
    </ui:datePicker.root>
    <ui:field.error />
</ui:field.root>
