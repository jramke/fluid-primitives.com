<ui:datePicker.root selectionMode="range">
    <ui:datePicker.control>
        <ui:datePicker.input index="0" />
        <ui:datePicker.rangeText>–</ui:datePicker.rangeText>
        <ui:datePicker.input index="1" />
        <ui:datePicker.trigger />
    </ui:datePicker.control>
    <ui:datePicker.content>
        <div class="flex gap-2 border-t pt-2">
            <ui:datePicker.presetTrigger value="thisWeek">This week</ui:datePicker.presetTrigger>
            <ui:datePicker.presetTrigger value="thisMonth">This month</ui:datePicker.presetTrigger>
            <ui:datePicker.presetTrigger value="last7Days">Last 7 days</ui:datePicker.presetTrigger>
        </div>
    </ui:datePicker.content>
</ui:datePicker.root>
