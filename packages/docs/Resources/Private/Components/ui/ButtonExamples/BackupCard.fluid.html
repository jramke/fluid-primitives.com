<ui:prop name="lastBackup" type="string" default="2 days ago" />

<f:variable name="labelId" value="{ui:id()}" />

<div class="flex w-84 items-center justify-between gap-4 rounded-lg border p-4 text-sm">
    <div>
        <p class="font-medium">Backup</p>
        <p class="text-muted-foreground" {ui:ref(name: 'status' )}>Last backup {lastBackup}</p>
    </div>

    <ui:button
        focusableWhenDisabled="{true}"
        aria-labelledby="{labelId}"
        autoMount="{false}"
        rootId="{rootId}-action">
        <ui:button.indicator state="{f:constant(name: 'Jramke\FluidPrimitives\Enum\ButtonIndicatorState::Loading')}">
            <svg class="animate-spin" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M21 12a9 9 0 1 1-6.219-8.56" />
            </svg>
        </ui:button.indicator>
        <span id="{labelId}">
            <ui:button.indicator state="{f:constant(name: 'Jramke\FluidPrimitives\Enum\ButtonIndicatorState::Idle')}">Back up now</ui:button.indicator>
            <ui:button.indicator state="{f:constant(name: 'Jramke\FluidPrimitives\Enum\ButtonIndicatorState::Loading')}">Backing up</ui:button.indicator>
        </span>
    </ui:button>
</div>
