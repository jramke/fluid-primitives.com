<f:variable name="labelId" value="{ui:id()}" />

<ui:button
    autoMount="{false}"
    rootId="loading-button"
    focusableWhenDisabled="{true}"
    aria-labelledby="{labelId}"
    class="min-w-32">
    <ui:button.indicator state="{f:constant(name: 'Jramke\FluidPrimitives\Enum\ButtonIndicatorState::Loading')}">
        <svg class="animate-spin" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
    </ui:button.indicator>
    <span id="{labelId}">
        <ui:button.indicator state="{f:constant(name: 'Jramke\FluidPrimitives\Enum\ButtonIndicatorState::Idle')}">Submit</ui:button.indicator>
        <ui:button.indicator state="{f:constant(name: 'Jramke\FluidPrimitives\Enum\ButtonIndicatorState::Loading')}">Submitting</ui:button.indicator>
    </span>
</ui:button>

<vite:asset entry="EXT:docs/Resources/Private/Components/ui/ButtonExamples/Loading.entry.ts" />
