<ui:prop name="label" type="string" default="Save changes" />
<ui:prop name="loadingLabel" type="string" default="Saving..." />
<ui:prop name="loading" type="boolean" optional="{true}" default="{false}" />

<f:variable name="labelId" value="{ui:id()}" />

<ui:button type="submit" loading="{loading}" focusableWhenDisabled="{true}" aria-labelledby="{labelId}" class="{class}">
    <ui:button.indicator state="{f:constant(name: 'Jramke\FluidPrimitives\Enum\ButtonIndicatorState::Loading')}">
        <svg class="animate-spin" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
    </ui:button.indicator>
    <span id="{labelId}">
        <ui:button.indicator state="{f:constant(name: 'Jramke\FluidPrimitives\Enum\ButtonIndicatorState::Idle')}">{label}</ui:button.indicator>
        <ui:button.indicator state="{f:constant(name: 'Jramke\FluidPrimitives\Enum\ButtonIndicatorState::Loading')}">{loadingLabel}</ui:button.indicator>
    </span>
</ui:button>
