<ui:prop name="example_id" type="string" default="simple" />

<f:switch expression="{example_id}">
    <f:case value="simple">
        <ui:passwordInputExamples.simple />
    </f:case>
    <f:case value="with-field">
        <ui:passwordInputExamples.withField />
    </f:case>
    <f:case value="ignore-password-managers">
        <ui:passwordInputExamples.ignorePasswordManagers />
    </f:case>
</f:switch>
