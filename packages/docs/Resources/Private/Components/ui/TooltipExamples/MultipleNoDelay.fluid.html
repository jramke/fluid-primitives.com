<div class="flex gap-1">
    <f:for each="{0: {letter: 'B', label: 'Bold', class: 'font-bold'}, 1: {letter: 'I', label: 'Italic', class: 'italic'}, 2: {letter: 'U', label: 'Underline', class: 'underline'}}" as="action">
        <ui:tooltip.root>
            <ui:tooltip.trigger asChild="{true}">
                <ui:button variant="ghost" size="icon">
                    <span class="{action.class}" aria-hidden="true">{action.letter}</span>
                    <span class="sr-only">{action.label}</span>
                </ui:button>
            </ui:tooltip.trigger>
            <ui:tooltip.content>{action.label}</ui:tooltip.content>
        </ui:tooltip.root>
    </f:for>
</div>
