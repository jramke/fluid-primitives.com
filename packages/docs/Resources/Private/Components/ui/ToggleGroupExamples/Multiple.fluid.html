<ui:toggleGroup.root multiple="{true}" defaultValue="{0: 'bold'}" aria-label="Text formatting">
    <ui:toggleGroup.item value="bold" aria-label="Bold" class="font-bold">B</ui:toggleGroup.item>
    <ui:toggleGroup.item value="italic" aria-label="Italic" class="italic">I</ui:toggleGroup.item>
    <ui:toggleGroup.item value="underline" aria-label="Underline" class="underline">U</ui:toggleGroup.item>
</ui:toggleGroup.root>
