<ui:prop name="example_id" type="string" default="simple" />

<f:switch expression="{example_id}">
    <f:case value="simple">
        <ui:inputExamples.simple />
    </f:case>
    <f:case value="word-count">
        <ui:inputExamples.wordCount />
    </f:case>
    <f:case value="with-field">
        <ui:inputExamples.withField />
    </f:case>
</f:switch>
