<ui:field.root name="email" required="{true}">
    <ui:field.label>Email</ui:field.label>
    <ui:input.root type="email">
        <ui:input.input autocomplete="email" placeholder="you@example.com" />
    </ui:input.root>
    <ui:field.description>We'll only use this to send your confirmation.</ui:field.description>
    <ui:field.error />
</ui:field.root>
