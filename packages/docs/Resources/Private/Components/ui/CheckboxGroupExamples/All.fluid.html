<ui:prop name="example_id" type="string" default="default" />

<f:switch expression="{example_id}">
    <f:case value="simple">
        <ui:checkboxGroupExamples.simple />
    </f:case>
    <f:case value="default-checked">
        <ui:checkboxGroupExamples.defaultChecked />
    </f:case>
    <f:case value="disabled-group">
        <ui:checkboxGroupExamples.disabledGroup />
    </f:case>
    <f:case value="disabled-items">
        <ui:checkboxGroupExamples.disabledItems />
    </f:case>
    <f:case value="max-selected">
        <ui:checkboxGroupExamples.maxSelected />
    </f:case>
    <f:case value="select-all">
        <ui:checkboxGroupExamples.selectAll />
    </f:case>
</f:switch>
