<ui:datePicker.root
    class="max-w-74"
    min="{f:format.date(date: 'now', format: 'Y-m-d')}"
    max="{f:format.date(date: '+30 days', format: 'Y-m-d')}">
    <ui:datePicker.label>Appointment (within the next 30 days)</ui:datePicker.label>
    <ui:datePicker.control>
        <ui:datePicker.input />
        <ui:datePicker.trigger />
    </ui:datePicker.control>
    <ui:datePicker.content />
</ui:datePicker.root>
