<ui:datePicker.root class="max-w-74">
    <ui:datePicker.label>Date</ui:datePicker.label>
    <ui:datePicker.control>
        <ui:datePicker.input />
        <ui:datePicker.trigger />
    </ui:datePicker.control>
    <ui:datePicker.content>
        <ui:datePicker.view view="day">
            <ui:datePicker.viewControl view="day">
                <ui:datePicker.prevTrigger view="day" />
                <div class="flex items-center gap-1">
                    <ui:datePicker.monthSelect class="hover:bg-accent cursor-pointer appearance-none border-0 px-2 font-medium shadow-none" />
                    <ui:datePicker.yearSelect class="hover:bg-accent cursor-pointer appearance-none border-0 px-2 font-medium shadow-none" />
                </div>
                <ui:datePicker.nextTrigger view="day" />
            </ui:datePicker.viewControl>
            <ui:datePicker.table view="day">
                <ui:datePicker.tableHeader />
                <ui:datePicker.tableBody />
            </ui:datePicker.table>
        </ui:datePicker.view>
    </ui:datePicker.content>
</ui:datePicker.root>
