<ui:datePicker.root
    class="max-w-74"
    selectionMode="{f:constant(name: 'Jramke\FluidPrimitives\Enum\DatePickerSelectionMode::Multiple')}"
    maxSelectedDates="3"
    autoMount="{false}"
    rootId="date-picker-multiple">
    <ui:datePicker.label>Dates (up to 3)</ui:datePicker.label>
    <ui:datePicker.control>
        <ui:datePicker.input />
        <ui:datePicker.clearTrigger />
        <ui:datePicker.trigger />
    </ui:datePicker.control>
    <ui:datePicker.content>
        <f:for each="{0: 'day', 1: 'month', 2: 'year'}" as="view">
            <ui:datePicker.view view="{view}">
                <ui:datePicker.viewControl view="{view}">
                    <ui:datePicker.prevTrigger view="{view}" />
                    <ui:datePicker.viewTrigger view="{view}">
                        <ui:datePicker.rangeText />
                    </ui:datePicker.viewTrigger>
                    <ui:datePicker.nextTrigger view="{view}" />
                </ui:datePicker.viewControl>
                <ui:datePicker.table view="{view}">
                    <ui:datePicker.tableHeader />
                    <ui:datePicker.tableBody />
                </ui:datePicker.table>
            </ui:datePicker.view>
        </f:for>
    </ui:datePicker.content>
    <p id="date-picker-multiple-dates" class="text-muted-foreground text-sm">No dates selected</p>
</ui:datePicker.root>

<vite:asset entry="EXT:docs/Resources/Private/Components/ui/DatePickerExamples/Multiple.entry.ts" />
