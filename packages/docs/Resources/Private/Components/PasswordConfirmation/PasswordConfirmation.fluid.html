<ui:exposeToClient />

<ui:form.root actionUri="#" controlled="{true}" rootId="{rootId}-form" class="w-full max-w-74">
    <ui:form.content class="space-y-6">
        <ui:field.root name="password" required="{true}">
            <ui:input.root type="password" autocomplete="new-password">
                <ui:input.label>Password</ui:input.label>
                <ui:input.input />
            </ui:input.root>
            <ui:field.description>At least 8 characters.</ui:field.description>
            <ui:field.error />
        </ui:field.root>

        <ui:field.root name="passwordConfirm" required="{true}" listenTo="{0: 'password'}">
            <ui:input.root type="password" autocomplete="new-password">
                <ui:input.label>Confirm password</ui:input.label>
                <ui:input.input />
            </ui:input.root>
            <ui:field.error />
        </ui:field.root>

        <ui:button type="submit">Save password</ui:button>
    </ui:form.content>

    <ui:form.indicator
        state="{f:constant(name: 'Jramke\FluidPrimitives\Enum\FormState::Success')}"
        class="space-y-3">
        <ui:form.successText class="block">Password updated successfully.</ui:form.successText>
        <ui:button type="reset">Reset</ui:button>
    </ui:form.indicator>
</ui:form.root>

<vite:asset entry="EXT:docs/Resources/Private/Components/PasswordConfirmation/PasswordConfirmation.entry.ts" />
