<f:alias map="{navRootId: rootId}">
    <primitives:dialog.root controlled="{true}" rootId="search-{navRootId}">
        <primitives:dialog.trigger asChild="{true}">
            <f:slot />
        </primitives:dialog.trigger>
        <ui:portal>
            <primitives:dialog.backdrop class="{ui:cn(value: '
                fixed inset-0 bg-black/50 z-[var(--layer-index,0)]
                transition-all ease-out duration-150 transition-discrete
                starting:data-[state=open]:opacity-0 starting:data-[state=open]:backdrop-blur-none
                data-[state=closed]:opacity-0 data-[state=closed]:backdrop-blur-none
                data-[state=open]:opacity-100 data-[state=open]:backdrop-blur-xs
            ')}" />
            <primitives:dialog.positioner class="fixed inset-0 flex items-start justify-center p-4 pt-[12vh] z-[var(--layer-index,0)]">
                <primitives:dialog.content spreadProps="{true}" class="{ui:cn(value: '
                    bg-popover text-popover-foreground w-full max-w-xl rounded-xl border shadow-lg
                    transition-all ease-out duration-175 transition-discrete
                    starting:data-[state=open]:opacity-0 starting:data-[state=open]:scale-95 starting:data-[state=open]:-translate-y-2
                    data-[state=closed]:opacity-0 data-[state=closed]:scale-95 data-[state=closed]:-translate-y-2
                    data-[state=open]:opacity-100 data-[state=open]:scale-100 data-[state=open]:translate-y-0
                ')}">
                    <ui:combobox.root rootId="search-combobox-{navRootId}" controlled="{true}" class="isolate flex flex-col items-stretch gap-0">
                        <ui:combobox.control class="!h-12 !rounded-xl !border-0 !shadow-none px-4 gap-2">
                            <ui:icon.search class="text-muted-foreground size-4 shrink-0" />
                            <ui:combobox.input placeholder="Search documentation…" class="!px-0" />
                            <ui:combobox.clearTrigger />
                            <kbd class="rounded-md border bg-secondary/50 px-1.5 text-xs text-muted-foreground content-center">Esc</kbd>
                        </ui:combobox.control>
                        <ui:combobox.content class="mt-2">
                            <ui:combobox.empty class="justify-start">
                                <span {ui:ref(name: 'statusText', context: 'combobox')}>Loading search index…</span>
                            </ui:combobox.empty>
                            <ui:template name="groupTemplate" context="combobox">
                                <ui:combobox.itemGroup>
                                    <ui:combobox.itemGroupLabel>
                                        <span {ui:ref(name: 'group-label', withId: false)}></span>
                                    </ui:combobox.itemGroupLabel>
                                </ui:combobox.itemGroup>
                            </ui:template>
                            <ui:template name="itemTemplate" context="combobox">
                                <ui:combobox.item>
                                    <ui:combobox.itemText>
                                        <span {ui:ref(name: 'title', withId: false)}></span>
                                    </ui:combobox.itemText>
                                    <ui:combobox.itemIndicator />
                                </ui:combobox.item>
                            </ui:template>
                        </ui:combobox.content>
                    </ui:combobox.root>
                </primitives:dialog.content>
            </primitives:dialog.positioner>
        </ui:portal>
    </primitives:dialog.root>
</f:alias>
