<ui:exposeToClient />

<ui:form.root action="homepage" autoMount="{false}" rootId="example-form" class="min-w-[275px]">

    <ui:form.content class="space-y-4">
        <ui:field.root name="homepage" required="{true}">
            <ui:field.label>Homepage</ui:field.label>
            <ui:input.root type="url">
                <ui:input.input pattern="https?://.*" placeholder="https://example.com" />
            </ui:input.root>
            <ui:field.helperText>Use `https://down.example.com` to preview the generic error state.</ui:field.helperText>
            <ui:field.errorText />
        </ui:field.root>

        <f:variable name="submitLabelId" value="{ui:id()}" />
        <ui:button
            type="submit"
            focusableWhenDisabled="{true}"
            aria-labelledby="{submitLabelId}"
            autoMount="{false}"
            rootId="example-form-submit">
            <span id="{submitLabelId}">
                <ui:button.indicator state="{f:constant(name: 'Jramke\FluidPrimitives\Enum\ButtonIndicatorState::Idle')}">Submit</ui:button.indicator>
                <ui:button.indicator state="{f:constant(name: 'Jramke\FluidPrimitives\Enum\ButtonIndicatorState::Loading')}">Submitting...</ui:button.indicator>
            </span>
        </ui:button>
    </ui:form.content>

    <ui:form.indicator
        state="{f:constant(name: 'Jramke\FluidPrimitives\Enum\FormState::Error')}"
        class="space-y-3">
        <p class="font-medium">Submission failed</p>
        <ui:form.errorText class="block">The demo server is unavailable right now.</ui:form.errorText>
        <ui:button type="reset">Try again</ui:button>
    </ui:form.indicator>

    <ui:form.indicator
        state="{f:constant(name: 'Jramke\FluidPrimitives\Enum\FormState::Success')}"
        class="space-y-3">
        <p class="font-medium">Submitted</p>
        <ui:form.successText class="block">Your homepage was submitted successfully.</ui:form.successText>
        <ui:button type="reset">Submit another</ui:button>
    </ui:form.indicator>
</ui:form.root>

<vite:asset entry="EXT:docs/Resources/Private/Components/FormExample/FormExample.entry.ts" />
