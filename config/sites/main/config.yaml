base: '%env(APP_URL)%'
dependencies:
  - fluid-primitives/docs
  - fluid-primitives/demos
languages:
  - title: English
    enabled: true
    languageId: 0
    base: /
    locale: en_US.UTF-8
    navigationTitle: English
    flag: us
rootPageId: 1
websiteTitle: ''
routeEnhancers:
  Docs:
    type: Extbase
    plugin: Docs
    extension: Docs
    limitToPages:
      - 1
    routes:
      - routePath: '/{path}'
        _controller: 'Docs::show'
        _arguments:
          path: 'path'
        defaults:
          path: ''
    defaultController: 'Docs::show'
    aspects:
      path:
        type: ValidatedPathMapper
  News:
    type: Extbase
    extension: News
    plugin: Pi1
    routes:
      - routePath: '/{news-title}'
        _controller: 'News::detail'
        _arguments:
          news-title: news
    aspects:
      news-title:
        type: PersistedAliasMapper
        tableName: tx_news_domain_model_news
        routeFieldName: path_segment
